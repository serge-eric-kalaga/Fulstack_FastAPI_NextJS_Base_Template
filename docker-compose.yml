services:

  mysql:
    image: mysql:latest
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - 3306
    networks:
      - asgard
      - monitor
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "mysql" ]
      interval: 5s
      timeout: 30s
      retries: 10
    env_file:
      - ./.env.dev

  backend:
    build: ./backend
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    restart: always
    volumes:
      - ./backend/:/app/
      - backend_uploads:/app/static/uploads
    expose:
      - 80
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - thor
      - asgard
      - loky
      - monitor
    env_file:
      - ./.env.dev
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/api/healthcheck/')"]
      interval: 5m30s
      timeout: 30s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    restart: always
    volumes:
      - ./frontend:/app
      # Contrat public pour régénérer le SDK sans exposer le code ou les secrets backend.
      - ./backend/openapi.json:/backend/openapi.json:ro
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    expose:
      - 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - asgard
    env_file:
      - ./.env.dev
    environment:
      BACKEND_URL: http://backend:80

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - asgard
    env_file:
      - ./.env.dev

  redis:
    image: redis:latest
    restart: always
    env_file:
      - ./.env.dev
    networks:
      - loky
    expose:
      - 6379


  log_viewer:
    image: httpd:latest
    restart: always
    ports:
      - "7777:80"
    volumes:
      - ./backend/logs:/usr/local/apache2/htdocs

networks:
  asgard:
  thor:
  loky:
  monitor:

volumes:
  backend_uploads:
  mysql_data:
  frontend_node_modules:
  frontend_next:
